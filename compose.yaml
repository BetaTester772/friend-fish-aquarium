# Self-hosting stack: the app plus Caddy, which fetches and renews a Let's
# Encrypt certificate on its own.
#
# HTTPS is not optional here: browsers refuse getUserMedia on an insecure
# origin, so without a certificate nobody can add a fish.
#
# Copy .env.example to .env, put your address in it, then:
#   docker compose up -d --build

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Tells the app the browser's original request was https, so the session
      # cookie keeps its Secure flag behind Caddy.
      FFA_TRUST_PROXY: "1"
      FFA_DATA_DIR: /data
      PORT: "8787"
    volumes:
      # The SQLite database and the stored face images. Back this up.
      - tank-data:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      FFA_DOMAIN: ${FFA_DOMAIN:-friend-fish-aquarium.betatester772.dev}
      # Required: an empty value makes Caddy's `email` directive a parse error,
      # so fail here with a readable message instead of inside the container.
      FFA_EMAIL: ${FFA_EMAIL:?set FFA_EMAIL in .env (Let us Encrypt expiry notices)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  tank-data:
  caddy-data:
  caddy-config:
